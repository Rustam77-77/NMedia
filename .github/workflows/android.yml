name: Android CI
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "⚠️ WARNING: GOOGLE_SERVICES_JSON secret not set!"
            echo "Creating dummy google-services.json..."
            cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-ci-project",
              "storage_bucket": "dummy-ci-project.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": {
                  "package_name": "ru.netology.nmedia"
                }
              },
              "api_key": [{
                "current_key": "AIzaSyDUMMY_CI_KEY"
              }],
              "services": {
                "appinvite_service": {}
              }
            }],
            "configuration_version": "1"
          }
          EOF
          else
            echo "Decoding google-services.json from secret..."
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          fi
          
          echo "✅ google-services.json created"
          ls -lh app/google-services.json
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build Debug APK
        run: ./gradlew assembleDebug
      - name: Run Unit Tests
        run: ./gradlew test
      # ============================================
      # ОБНОВЛЕНО: actions/upload-artifact@v4
      # ============================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - name: Cleanup
        if: always()
        run: |
          rm -f app/google-services.json
          echo "✅ Cleanup completed"