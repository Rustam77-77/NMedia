name: Android CI
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
    # ============================================
    # ДЕКОДИРОВАНИЕ google-services.json из Secret
    # ============================================
    - name: Decode google-services.json
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        echo "Decoding google-services.json..."
        echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
        
        # Проверка
        if [ ! -f app/google-services.json ]; then
          echo "❌ ERROR: google-services.json not created!"
          exit 1
        fi
        
        echo "✅ google-services.json decoded successfully"
        ls -lh app/google-services.json
    # ============================================
    # СБОРКА ПРОЕКТА
    # ============================================
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build
    - name: Run tests
      run: ./gradlew test
    # ============================================
    # ЗАГРУЗКА APK
    # ============================================
    - name: Upload Debug APK
      uses: actions/upload-artifact@v3
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
    - name: Upload Release APK
      if: github.event_name == 'push'
      uses: actions/upload-artifact@v3
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release-unsigned.apk
    # ============================================
    # ОЧИСТКА СЕКРЕТНЫХ ДАННЫХ
    # ============================================
    - name: Cleanup secrets
      if: always()
      run: |
        rm -f app/google-services.json
        echo "✅ Secrets cleaned up"
